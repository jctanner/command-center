# Each entry represents one machine + tmux socket.
[[hosts]]
id = "local"
name = "This machine"
# socket = "/absolute/path/to/tmux.sock" # optional, passed as tmux -S

# Uses your system OpenSSH config, agent, and known_hosts.
# Establish trust with ssh first; unknown or changed keys are rejected.
